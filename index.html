<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E4F">
<meta name="description" content="Catat ceramah dengan rekam suara. Ayat Al-Qur'an dan hadits yang disebut ustadz langsung muncul lengkap dengan teks Arab dan terjemahnya.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>body{margin:0}img{max-width:100%}</style>
<title>Catat Ceramah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap">
<style>
/* Layout: one narrow column like a notebook page; a fixed dock at the bottom holds the tools a thumb needs mid-lecture. */
:root{
  --paper:#F3F6F3; --surface:#FFFFFF; --sunk:#E9EEEA; --ink:#14211B; --muted:#5A6A62; --line:#D8E0DA;
  --accent:#0B6E4F; --accent-ink:#FFFFFF; --accent-soft:#DDEFE7;
  --ayat:#87570F; --ayat-bg:#FBF4E6; --ayat-line:#EBD9B4;
  --hadits:#2C5687; --hadits-bg:#EDF2F9; --hadits-line:#CCDAEC;
  --mark:#A8402C; --mark-bg:#FBEEEA; --mark-line:#F0CFC6;
  --rec:#C42B37;
  --shadow:0 10px 30px rgba(20,33,27,.10);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Scheherazade New","Amiri","Traditional Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1412; --surface:#151D1A; --sunk:#1B2521; --ink:#E5EDE8; --muted:#93A39B; --line:#26332D;
  --accent:#3DB487; --accent-ink:#04140D; --accent-soft:#163428;
  --ayat:#E3B868; --ayat-bg:#1F1A10; --ayat-line:#3B311C;
  --hadits:#90B5E2; --hadits-bg:#111B27; --hadits-line:#22344A;
  --mark:#EE8B76; --mark-bg:#281613; --mark-line:#4A2721;
  --rec:#FF5E68; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1412; --surface:#151D1A; --sunk:#1B2521; --ink:#E5EDE8; --muted:#93A39B; --line:#26332D;
  --accent:#3DB487; --accent-ink:#04140D; --accent-soft:#163428;
  --ayat:#E3B868; --ayat-bg:#1F1A10; --ayat-line:#3B311C;
  --hadits:#90B5E2; --hadits-bg:#111B27; --hadits-line:#22344A;
  --mark:#EE8B76; --mark-bg:#281613; --mark-line:#4A2721;
  --rec:#FF5E68; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.ar{font-family:var(--f-ar);direction:rtl;text-align:right;font-size:1.6rem;line-height:2.15}
.small{font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.55rem .9rem;font-weight:600;font-size:.92rem;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--rec)}
.btn svg{width:18px;height:18px;flex:none}
.iconbtn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:0;background:transparent;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;font-weight:600;padding:.15rem .55rem;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:.5rem;min-height:56px}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:-.01em;font-size:1.08rem}
.brand .seal{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-ar);font-size:1.15rem;line-height:1}
.grow{flex:1;min-width:0}

/* ---------- list view ---------- */
.hero{padding-block:22px 6px}
.hero h1{font-size:1.65rem;line-height:1.2;margin:0 0 .35rem;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 8px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.how b{display:block;font-size:.9rem;margin-bottom:2px}
.how span{font-size:.8rem;color:var(--muted);line-height:1.4;display:block}
@media (max-width:560px){.how{grid-template-columns:1fr}}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.listhead h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.notes{display:grid;gap:10px;padding-bottom:40px}
.note-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.note-card:hover{border-color:var(--muted)}
.note-card h3{margin:0 0 2px;font-size:1.05rem;line-height:1.3}
.note-card .meta{font-size:.82rem;color:var(--muted)}
.note-card .counts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.c-ayat{background:var(--ayat-bg);color:var(--ayat)}
.c-hadits{background:var(--hadits-bg);color:var(--hadits)}
.c-mark{background:var(--mark-bg);color:var(--mark)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center}
.empty p{margin:.2rem 0 1rem;color:var(--muted)}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- editor ---------- */
.ed{padding-block:14px 230px}
.ed-title{width:100%;border:0;background:transparent;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;padding:4px 0;outline:none}
.ed-title::placeholder{color:var(--muted);opacity:.6}
.ed-meta{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin:6px 0 14px}
@media (max-width:560px){.ed-meta{grid-template-columns:1fr 1fr}.ed-meta .f-ustadz{grid-column:1/-1}}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.45rem .6rem;min-width:0;width:100%}
.blocks{display:flex;flex-direction:column;gap:10px}
.tblock{width:100%;border:0;background:transparent;resize:none;outline:none;font-size:1.02rem;line-height:1.65;padding:4px 0;min-height:2.2em;overflow:hidden}
.tblock::placeholder{color:var(--muted);opacity:.7}
.partial{color:var(--muted);font-style:italic;margin-top:-6px}
.card{border-radius:16px;border:1px solid;padding:12px 14px 12px;position:relative;min-width:0}
.card.ayat{background:var(--ayat-bg);border-color:var(--ayat-line)}
.card.hadits{background:var(--hadits-bg);border-color:var(--hadits-line)}
.card.mark{background:var(--mark-bg);border-color:var(--mark-line)}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card-head .ref{font-weight:800;font-size:.88rem;letter-spacing:.01em}
.card.ayat .ref{color:var(--ayat)} .card.hadits .ref{color:var(--hadits)} .card.mark .ref{color:var(--mark)}
.card-head .iconbtn{width:32px;height:32px;margin-left:auto}
.card-head .iconbtn + .iconbtn{margin-left:0}
.card .ar{font-size:1.55rem}
.card .tr{font-size:.95rem;margin-top:4px}
.card .tr .n{font-weight:700;color:var(--muted);font-size:.78rem;margin-right:3px}
.card .lat{font-size:.85rem;color:var(--muted);font-style:italic;margin-top:2px}
.card .more{border:0;background:none;color:var(--hadits);font-weight:700;padding:0;font-size:.85rem}
.card .ctx{font-style:italic;color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.ayah-end{font-family:var(--f-ar);color:var(--ayat);font-size:1.1rem;padding:0 .15em}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{padding-block:8px 10px;display:flex;flex-direction:column;gap:8px}
.sugs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sugs:empty{display:none}
.sug{flex:none;display:flex;align-items:center;gap:6px;border-radius:12px;padding:6px 6px 6px 10px;font-size:.85rem;border:1px solid}
.sug.ayat{background:var(--ayat-bg);border-color:var(--ayat-line);color:var(--ayat)}
.sug.hadits{background:var(--hadits-bg);border-color:var(--hadits-line);color:var(--hadits)}
.sug b{font-weight:800}
.sug button{border:0;border-radius:8px;padding:4px 8px;font-weight:700;font-size:.8rem;background:var(--surface);color:inherit}
.sug .x{background:transparent;padding:4px}
.tools{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-height:58px;font-size:.78rem;font-weight:700;padding:4px}
.tool svg{width:22px;height:22px}
.tool.rec{background:var(--accent);color:var(--accent-ink);border-color:transparent;flex-direction:row;gap:8px;font-size:.92rem}
.tool.rec.on{background:var(--rec);color:#fff}
.tool.rec.on .pulse{animation:pulse 1.2s ease-in-out infinite}
.tool.rec[disabled]{opacity:.55}
.tool.t-ayat{color:var(--ayat)} .tool.t-hadits{color:var(--hadits)} .tool.t-mark{color:var(--mark)}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
@media (prefers-reduced-motion:reduce){.tool.rec.on .pulse{animation:none}}
.rechint{font-size:.78rem;color:var(--muted);text-align:center;margin:0}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:min(92%,860px);height:92%;background:var(--paper);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet{left:50%;transform:translateX(-50%);width:720px}}
.sheet-head{padding-top:10px;border-bottom:1px solid var(--line)}
.sheet-head .wrap{display:flex;flex-direction:column;gap:10px;padding-block:0 12px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.tabs{display:flex;gap:6px;align-items:center}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.35rem .95rem;font-weight:700;font-size:.9rem}
.tab[aria-selected="true"].ayat{background:var(--ayat);color:var(--surface);border-color:transparent}
.tab[aria-selected="true"].hadits{background:var(--hadits);color:var(--surface);border-color:transparent}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:.65rem .8rem;font-size:1rem}
.search input:focus{border-color:var(--accent);outline:none}
.examples{display:flex;gap:6px;flex-wrap:wrap}
.ex{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:.15rem .6rem;font-size:.78rem;color:var(--muted)}
.books{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.book{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.2rem .7rem;font-size:.8rem;font-weight:600;color:var(--muted)}
.book[aria-pressed="true"]{background:var(--hadits-bg);color:var(--hadits);border-color:var(--hadits-line)}
.ctxbox{background:var(--mark-bg);border:1px solid var(--mark-line);color:var(--ink);border-radius:12px;padding:8px 10px;font-size:.85rem}
.ctxbox b{color:var(--mark)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body .wrap{padding-block:12px 40px;display:flex;flex-direction:column;gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.res .ref{font-weight:800;font-size:.86rem}
.res.ayat .ref{color:var(--ayat)} .res.hadits .ref{color:var(--hadits)}
.res .row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.res .row .btn{margin-left:auto;min-height:36px;padding:.35rem .8rem}
.res .ar{font-size:1.4rem;line-height:2}
.res .tr{font-size:.92rem}
.res mark{background:color-mix(in srgb,var(--ayat) 25%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.res.ai{border-style:dashed}
.status{color:var(--muted);font-size:.9rem;text-align:center;padding:14px 4px}
.ai-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-note{font-size:.8rem;color:var(--muted)}
.range{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.range input{width:64px;border:1px solid var(--line);border-radius:8px;padding:.25rem .4rem;background:var(--surface)}

/* share sheet */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.mini{left:50%;transform:translateX(-50%);width:520px}}
.mini .wrap{padding-block:12px 22px;display:flex;flex-direction:column;gap:8px}
.mini h3{margin:4px 0 6px;font-size:1rem}
.mini .btn{justify-content:flex-start;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:.55rem 1rem;border-radius:12px;font-size:.9rem;font-weight:600;max-width:calc(100% - 32px);text-align:center}
textarea.copybox{width:100%;height:140px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);font-size:.8rem}
.loadbar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.loadbar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>

</head><body>
<div id="app"></div>

<script>
(() => {
"use strict";
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AR_DIG = "٠١٢٣٤٥٦٧٨٩";
const arNum = n => String(n).replace(/\d/g, d => AR_DIG[d]);
const uid = () => "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowTime = () => new Date().toLocaleTimeString("id-ID", {hour: "2-digit", minute: "2-digit"});
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = iso => { try { return new Date(iso + "T00:00:00").toLocaleDateString("id-ID", {weekday: "long", day: "numeric", month: "long", year: "numeric"}); } catch { return iso; } };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const stripAr = s => String(s).replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g, "").replace(/[إأآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, "");
const hasAr = s => /[؀-ۿ]/.test(s);
const lower = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

const ICON = {
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5" class="pulse"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5z"/><path d="M12 6v14"/></svg>',
  scroll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h11a2 2 0 0 1 2 2v1h-4M7 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7M7 4a2 2 0 0 1 2 2v0"/><path d="M9 10h6M9 14h6"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',

function parseAyatQuery(q) {

    const p = parseAyatQuery(q);
    if (p && p.whole) {
      const su = QURAN[p.s - 1]; const max = Math.min(su.v.length, SS.limit);
      let h = `<div class="status">${esc(surahLabel(p.s))} · ${su.v.length} ayat · ${esc(su.arti)}. Pilih ayatnya:</div>`;
      for (let a = 1; a <= max; a++) h += ayatResHTML(p.s, a, a);

      box.innerHTML = h; return;
    }
    if (p) {
      const len = QURAN[p.s - 1].v.length;

function searchAyatText(q) {

  if (hasAr(q)) { const k = stripAr(q); if (k.length < 2) return out; QIDX.forEach(v => { if (v.ar.includes(k)) out.push({s: v.s, a: v.a, sc: 1, terms: []}); }); return out.slice(0, 200); }

    if (!terms.every(t => h.lo.includes(t))) return;
    total++;
    let sc = 0; if (h.lo.includes(phrase)) sc += 10; if (h.title && lower(h.title).includes(terms[0])) sc += 5; sc += 2000 / (h.lo.length + 200); if (id === "arbain") sc += 3;
    items.push({book: id, h, sc});
  }));
  items.sort((a, b) => b.sc - a.sc);
  return {items: items.slice(0, 200), total, terms};
}
function snippet(text, terms, len = 340) {
  if (text.length <= len) return hl(text, terms);
  const lo = lower(text); let at = 0; for (const t of terms) { const i = lo.indexOf(t); if (i >= 0) { at = i; break; } }
  const start = Math.max(0, at - 120);
  return (start ? "… " : "") + hl(text.slice(start, start + len), terms) + " …";
}
function hadResHTML(book, h, terms = [], extra = "") {
  return `<div class="res hadits${extra ? " ai" : ""}">
    <div class="row"><span class="ref">${esc(hadithRef(book, h.no))}${h.title ? " · " + esc(h.title) : ""}</span><button class="btn primary" data-ins-had="${book}:${h.no}">Sisipkan</button></div>
    ${extra}
    <div class="ar" lang="ar" style="font-size:1.25rem">${esc(h.ar.length > 260 ? h.ar.slice(0, 240) + " …" : h.ar)}</div>
    <div class="tr">${snippet(h.id, terms)}</div>
  </div>`;
}

/* ---------- AI helper ---------- */
async function askAI() {
  const box = resultsEl(); if (!Cap.sample || !box) return;
  const hint = [SS.q.trim(), SS.ctx].filter(Boolean).join("\n");
  if (!hint) { toast("Tulis dulu potongan yang kamu dengar di kolom pencarian."); $("#s-q") && $("#s-q").focus(); return; }
  SS.aiCtl && SS.aiCtl.abort(); SS.aiCtl = new AbortController();
  const ay = SS.tab === "ayat"; const seq = ++SS.seq;
  box.innerHTML = '<div class="status">AI sedang menebak…<div class="loadbar"><i></i></div></div>';
  const prompt = ay
    ? `Seseorang sedang mencatat ceramah dan tidak sempat menulis ayat Al-Qur'an yang dibacakan ustadz. Dari petunjuk berikut (bisa berupa potongan bacaan Arab yang ditulis dengan huruf latin dan ejaan tidak baku, potongan terjemah, tema, atau kalimat ustadz di sekitarnya), tebak ayat yang paling mungkin dimaksud.\n\nPetunjuk:\n"""${hint.slice(0, 1500)}"""\n\nBalas HANYA JSON array berisi maksimal 4 tebakan, urut dari yang paling yakin: [{"surah": nomor 1-114, "ayat_awal": nomor, "ayat_akhir": nomor, "alasan": "satu kalimat bahasa Indonesia"}]`
    : `Seseorang sedang mencatat ceramah dan tidak sempat menulis hadits yang disampaikan ustadz. Dari petunjuk berikut (potongan matan Arab dalam huruf latin, potongan terjemah, tema, atau kalimat ustadz), tebak hadits yang paling mungkin dimaksud.\n\nPetunjuk:\n"""${hint.slice(0, 1500)}"""\n\nBalas HANYA JSON array berisi maksimal 4 tebakan: [{"kitab": salah satu dari "arbain","bukhari","muslim","abu-daud","tirmidzi","nasai","ibnu-majah","ahmad","darimi","malik", "kata_kunci": "2-4 kata bahasa Indonesia yang PASTI ada di terjemah hadits itu, dipisah spasi", "isi": "ringkasan isi hadits satu kalimat", "alasan": "satu kalimat"}]. Untuk hadits yang ada di Arba'in An-Nawawi, utamakan "arbain".`;
  let guesses;
  try { guesses = await Cap.sample.json(prompt, {signal: SS.aiCtl.signal}); }
  catch (e) {
    if (seq !== SS.seq) return;
    box.innerHTML = `<div class="status">${e && e.code === "not_granted" ? "Fitur AI tidak diizinkan. Kamu tetap bisa mencari manual." : e && e.code === "rate_limited" ? "AI sedang sibuk. Coba lagi sebentar lagi." : e && e.code === "cancelled" ? "" : "AI belum bisa menjawab. Coba tulis petunjuk dengan kata lain."}</div>`;
    if (e && e.code === "not_granted") { Cap.sample = null; UI.refreshAI(); }
    return;
  }
  if (seq !== SS.seq) return;
  if (!Array.isArray(guesses) || !guesses.length) { box.innerHTML = '<div class="status">AI tidak menemukan tebakan. Coba tambah petunjuk.</div>'; return; }
  let h = '<div class="status">Tebakan AI. Teks di bawah diambil dari mushaf dan kitab asli, cocokkan dulu dengan yang kamu dengar sebelum menyisipkan.</div>';
  if (ay) {
    await getQuran();
    guesses.slice(0, 4).forEach(g => {
      const s = +g.surah, a = +g.ayat_awal, b = +(g.ayat_akhir || g.ayat_awal);
      if (!(s >= 1 && s <= 114)) return; const len = QURAN[s - 1].v.length; if (!(a >= 1 && a <= len)) return;
      h += ayatResHTML(s, a, Math.min(Math.max(b, a), len, a + 9), [], `<div class="ai-note">${ICON.spark.replace("<svg", '<svg width="13" height="13"')} ${esc(g.alasan || "")}</div>`);
    });
  } else {
    for (const g of guesses.slice(0, 4)) {
      const id = BOOKS.some(b => b.id === g.kitab) ? g.kitab : "bukhari";
      try { await getBook(id); } catch { continue; }
      const terms = lower(g.kata_kunci || "").split(/\s+/).filter(t => t.length >= 3);
      let found = terms.length ? HAD[id].list.filter(x => terms.every(t => x.lo.includes(t))) : [];
      if (!found.length && terms.length > 1) found = HAD[id].list.filter(x => terms.filter(t => x.lo.includes(t)).length >= terms.length - 1);
      found.sort((a, b) => a.lo.length - b.lo.length);
      h += `<div class="res hadits ai"><div class="ref">${esc(bookName(id))}: ${esc(g.isi || "")}</div><div class="ai-note">${esc(g.alasan || "")}</div></div>`;
      h += found.slice(0, 3).map(x => hadResHTML(id, x, terms)).join("") || `<div class="status">Teksnya belum ketemu di kitab ${esc(bookName(id))}. Coba cari manual dengan kata "${esc(g.kata_kunci || "")}".</div>`;
    }
  }
  box.innerHTML = h;
}

/* ---------- share sheet ---------- */
function openShare() {

  const n = state.note;

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast("Teks disalin. Tempel di WhatsApp atau aplikasi catatan."); return; } catch {}
  const ex = $("#sh-extra"); if (ex) { ex.innerHTML = `<p class="small muted">Salin otomatis tidak tersedia. Tekan lama teks di bawah, pilih semua, lalu salin.</p><textarea class="copybox" readonly>${esc(txt)}</textarea>`; const ta = ex.querySelector("textarea"); ta.focus(); ta.select(); }
}

/* ================= render & events ================= */
function render() {
  const app = $("#app");
  app.innerHTML = state.view === "edit" && state.note ? renderEditor() : renderList();
  if (state.view === "edit") { app.querySelectorAll("textarea").forEach(autosize); UI.refreshRec(); UI.refreshSugs(); }
  UI.refreshStatus();
}

const debSave = (() => { let t; return () => { clearTimeout(t); t = setTimeout(() => state.note && Store.save(state.note), 400); }; })();
const debScan = (() => { let t; return txt => { clearTimeout(t); t = setTimeout(() => scanForSugs(txt), 1200); }; })();

document.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("textarea.tblock")) { const i = +t.dataset.i; const b = state.note.blocks[i]; if (b) { b.t = t.value; autosize(t); state.focus = {i, pos: t.selectionStart}; debSave(); const p = t.selectionStart; debScan(t.value.slice(Math.max(0, p - 200), p + 20)); } return; }
  if (state.note && ["f-title", "f-ustadz", "f-date", "f-place"].includes(t.id)) { state.note[{"f-title": "title", "f-ustadz": "ustadz", "f-date": "date", "f-place": "place"}[t.id]] = t.value; debSave(); return; }
  if (t.id === "s-q") { SS.q = t.value; SS.limit = 25; clearTimeout(SS.qt); SS.qt = setTimeout(runSearch, 250); return; }
  if (t.dataset.ra || t.dataset.rb) return;
});
document.addEventListener("focusin", e => { const t = e.target; if (t.matches && t.matches("textarea.tblock")) state.focus = {i: +t.dataset.i, pos: t.selectionStart}; });
document.addEventListener("selectionchange", () => { const t = document.activeElement; if (t && t.matches && t.matches("textarea.tblock")) state.focus = {i: +t.dataset.i, pos: t.selectionStart}; });
document.addEventListener("submit", e => { e.preventDefault(); if (e.target.id === "s-form") { clearTimeout(SS.qt); runSearch(); $("#s-q") && $("#s-q").blur(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet-root") && $("#sheet-root").innerHTML) closeSheet(); });

document.addEventListener("click", async e => {
  const el = e.target.closest("button, .scrim"); if (!el) return;
  const d = el.dataset;
  if (d.close) { closeSheet(); return; }
  if (d.open) { openNote(d.open); return; }
  if (d.act === "new") { newNote(); return; }
  if (d.act === "example") { await makeExample(); return; }
  if (d.act === "back") { if (Rec.state !== "idle" && Cap.dict) Cap.dict.stop().catch(() => {}); state.note && Store.save(state.note, true); state.view = "list"; state.note = null; render(); window.scrollTo(0, 0); return; }
  if (d.act === "rec") {
    if (el.dataset.na) { toast("Browser ini belum mendukung rekam suara. Buka link ini di Google Chrome, atau ketuk kolom catatan lalu pakai tombol mic di keyboard HP."); return; }
    Rec.toggle(); return;
  }
  if (d.act === "ayat" || d.act === "hadits") { openSheet(d.act); return; }
  if (d.act === "mark") {
    const n = state.note; const lastT = [...n.blocks].reverse().find(b => b.type === "text");
    const ctx = ((lastT && lastT.t) || "").slice(-140).replace(/^\S*\s/, "").trim();
    insertBlocks([{type: "mark", kind: "ayat", time: nowTime(), ctx}], {atEnd: Rec.state !== "idle"});
    toast("Ditandai. Lanjutkan mendengar, isi ayatnya nanti."); return;
  }
  if (d.act === "share") { openShare(); return; }
  if (d.sh === "copy") { await copyText(noteToText(state.note)); return; }
  if (d.sh === "txt") { const n = state.note; try { await Cap.downloads.save({filename: (n.title || "catatan-ceramah").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").slice(0, 60) + ".txt", data: noteToText(n)}); toast("File disimpan."); } catch (err) { if (!err || err.code !== "declined") toast("File belum bisa diunduh. Pakai Salin teks saja."); } return; }
  if (d.sh === "del") { const ex = $("#sh-extra"); ex.innerHTML = `<p class="small">Catatan ini akan dihapus permanen.</p><button class="btn danger" data-sh="del2">${ICON.trash}Ya, hapus</button>`; return; }
  if (d.sh === "del2") { Store.remove(state.note.id); closeSheet(); state.view = "list"; state.note = null; render(); toast("Catatan dihapus."); return; }
  if (d.del != null) { const n = state.note; n.blocks.splice(+d.del, 1); normalizeBlocks(n); Store.save(n); renderBlocks(); return; }
  if (d.up != null) { const n = state.note, i = +d.up; let j = i - 1; while (j >= 0 && n.blocks[j].type === "text" && !n.blocks[j].t) j--; if (j < 0) return; const [b] = n.blocks.splice(i, 1); n.blocks.splice(j, 0, b); normalizeBlocks(n); Store.save(n); renderBlocks(); return; }
  if (d.more != null) { const b = state.note.blocks[+d.more]; b._open = !b._open; renderBlocks(); return; }
  if (d.fill != null || d.fillh != null) { const i = +(d.fill ?? d.fillh); const b = state.note.blocks[i]; openSheet(d.fillh != null ? "hadits" : "ayat", {ctx: b.ctx, replaceIndex: i, noFocus: true}); return; }
  if (d.sug != null) {
    const r = state.sugs[+d.sug]; state.sugs.splice(+d.sug, 1); state.dismissed.add(refKey(r)); UI.refreshSugs();
    const ok = await insertRef(r, {atEnd: true});
    if (!ok && r.type === "hadits") openSheet("hadits", {book: r.book, noFocus: true});
    return;
  }
  if (d.sugx != null) { const r = state.sugs[+d.sugx]; state.sugs.splice(+d.sugx, 1); state.dismissed.add(refKey(r)); UI.refreshSugs(); return; }
  // sheet
  if (d.tab) { SS.tab = d.tab; SS.limit = 25; const keepQ = SS.q; renderSheet(); $("#s-q").value = keepQ; runSearch(); return; }
  if (d.ex) { SS.q = d.ex; $("#s-q").value = d.ex; runSearch(); return; }
  if (d.book) { if (SS.books.has(d.book)) SS.books.delete(d.book); else SS.books.add(d.book); el.setAttribute("aria-pressed", SS.books.has(d.book)); runSearch(); return; }
  if (el.id === "ai-btn") { askAI(); return; }
  if (d.moreres) { SS.limit += 25; runSearch(); return; }
  if (d.insAyat) {
    const [s, a0, b0] = d.insAyat.split(":").map(Number); const res = el.closest(".res");
    let a = +(res.querySelector("[data-ra]")?.value || a0), b = +(res.querySelector("[data-rb]")?.value || b0);
    const len = QURAN[s - 1].v.length; a = Math.min(Math.max(1, a || a0), len); b = Math.min(Math.max(a, b || a), len);
    const rep = SS.replaceIndex; closeSheet(); insertBlocks([ayatBlock(s, a, b)], rep != null ? {replaceIndex: rep} : {atEnd: Rec.state !== "idle"}); toast(ayatRef(s, a, b) + " disisipkan"); return;
  }
  if (d.insHad) {
    const [book, no] = d.insHad.split(":"); const h = HAD[book].byNo.get(+no);
    const rep = SS.replaceIndex; closeSheet(); insertBlocks([hadithBlock(book, h)], rep != null ? {replaceIndex: rep} : {atEnd: Rec.state !== "idle"}); toast(hadithRef(book, h.no) + " disisipkan"); return;
  }
});
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset || !(t.dataset.ra || t.dataset.rb)) return;
  const res = t.closest(".res"); const s = +(t.dataset.ra || t.dataset.rb);
  let a = +res.querySelector("[data-ra]").value, b = +res.querySelector("[data-rb]").value; const len = QURAN[s - 1].v.length;
  a = Math.min(Math.max(1, a || 1), len); b = Math.min(Math.max(a, b || a), len, a + 19);
  const tmp = document.createElement("div"); tmp.innerHTML = ayatResHTML(s, a, b); res.replaceWith(tmp.firstElementChild);
});

async function makeExample() {
  try { await getQuran(); } catch { toast("Data Al-Qur'an gagal dimuat. Coba lagi."); return; }
  let had = null; try { const A = await getBook("arbain"); had = A.byNo.get(1); } catch {}
  const blocks = [
    {type: "text", t: "Ustadz membuka kajian dengan menjelaskan bahwa sabar bukan berarti diam. Sabar itu menahan diri dari keluh kesah sambil terus berusaha. Allah berfirman dalam surat Al-Baqarah ayat 153:"},
    ayatBlock(2, 153, 153),
    {type: "text", t: "Tiga jenis sabar: sabar dalam ketaatan, sabar menjauhi maksiat, dan sabar menghadapi musibah. Semua amal itu harus diawali niat yang lurus, sebagaimana hadits pertama dalam Arba'in:"},
  ];
  if (had) blocks.push(hadithBlock("arbain", had));
  blocks.push({type: "text", t: "Ustadz lalu membaca ayat tentang kemudahan setelah kesulitan, terlalu cepat untuk dicatat, jadi ditandai dulu:"});
  blocks.push({type: "mark", kind: "ayat", time: "20.14", ctx: "fa inna ma'al usri yusro, inna ma'al usri yusro, sesungguhnya bersama kesulitan ada kemudahan"});
  blocks.push({type: "text", t: ""});
  newNote({title: "Contoh: Keutamaan Sabar", ustadz: "(contoh) Ustadz Fulan", place: "Masjid Al-Ikhlas", blocks});
}
